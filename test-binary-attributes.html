<!DOCTYPE html>
<html>
<head>
  <title>Deck.gl Binary Attributes Test</title>
  <script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const {DeckGL, ScatterplotLayer} = deck;

    // Test 1: Traditional accessor function approach (should work)
    const testAccessorFunction = () => {
      const data = [
        {lng: -122.4, lat: 37.8},
        {lng: -122.5, lat: 37.7},
        {lng: -122.3, lat: 37.9},
      ];

      return new ScatterplotLayer({
        id: 'test-accessor',
        data,
        getPosition: d => [d.lng, d.lat, 0],
        getRadius: 50000,
        getFillColor: [255, 0, 0, 200],
      });
    };

    // Test 2: Binary attribute format (what we're trying to use)
    const testBinaryAttributes = () => {
      // Binary position attribute
      const positions = new Float32Array([
        -122.4, 37.8, 0,  // point 1
        -122.5, 37.7, 0,  // point 2
        -122.3, 37.9, 0,  // point 3
      ]);

      const numPoints = positions.length / 3;

      console.log('Binary attributes test - trying data.attributes format:', {
        numPoints,
        positionsLength: positions.length,
        firstPosition: [positions[0], positions[1], positions[2]]
      });

      // Try passing attributes in data object (Apache Arrow / GPU buffer style)
      return new ScatterplotLayer({
        id: 'test-binary',
        data: {
          length: numPoints,
          attributes: {
            getPosition: {value: positions, size: 3}
          }
        },
        getRadius: 50000,
        getFillColor: [0, 255, 0, 200],
      });
    };

    // Start with accessor function test
    let useBinary = false;

    const deckgl = new DeckGL({
      container: 'map',
      initialViewState: {
        longitude: -122.4,
        latitude: 37.8,
        zoom: 9,
        pitch: 0,
        bearing: 0
      },
      controller: true,
      layers: [useBinary ? testBinaryAttributes() : testAccessorFunction()]
    });

    console.log('=== Deck.gl Binary Attribute Test ===');
    console.log('Red dots: accessor function (traditional)');
    console.log('Green dots: binary attributes');
    console.log('Press spacebar to toggle between modes');

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        useBinary = !useBinary;
        console.log('Switched to:', useBinary ? 'BINARY ATTRIBUTES' : 'ACCESSOR FUNCTION');
        deckgl.setProps({
          layers: [useBinary ? testBinaryAttributes() : testAccessorFunction()]
        });
      }
    });
  </script>
</body>
</html>
