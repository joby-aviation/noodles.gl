name: test

# Test on every pull request, and on push to main
on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  lint-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        run: |
          cd noodles-editor
          npm run lint

      - name: Check formatting
        run: |
          cd noodles-editor
          npm run format:check

  test-app:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        working-directory: noodles-editor
        run: |
          version=$(node -e "console.log(require('./package.json').devDependencies['playwright'])")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: |
          cd noodles-editor
          npx playwright install chromium --with-deps
        env:
          DEBIAN_FRONTEND: noninteractive
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Ensure Playwright browsers are available
        run: |
          cd noodles-editor
          npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run tests
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_CESIUM_ACCESS_TOKEN: ${{ secrets.VITE_CESIUM_ACCESS_TOKEN }}
        run: |
          cd noodles-editor
          npm test

  test-e2e:
    # Renders the linux/ visual baselines in noodles-editor/e2e/__snapshots__
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        working-directory: noodles-editor
        run: |
          version=$(node -e "console.log(require('./package.json').devDependencies['playwright'])")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        working-directory: noodles-editor
        run: npx playwright install chromium --with-deps
        env:
          DEBIAN_FRONTEND: noninteractive
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Ensure Playwright browsers are available
        working-directory: noodles-editor
        run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # A missing baseline is rendered here instead of failing the job, so baselines come
      # from this runner's software WebGL and fonts, not from a developer's machine
      - name: Run Playwright tests
        working-directory: noodles-editor
        run: npm run test:e2e

      - name: Report new baselines
        if: always()
        working-directory: noodles-editor
        run: |
          new=$(git status --porcelain --untracked-files=all -- e2e/__snapshots__/linux)
          if [ -n "$new" ]; then
            echo "$new"
            echo "::warning title=New visual baselines::$(echo "$new" | wc -l) examples had no baseline. Review the images in the visual-baselines artifact and commit them to noodles-editor/e2e/__snapshots__/linux/."
          fi

      - name: Upload baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-baselines
          path: noodles-editor/e2e/__snapshots__/linux/
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            noodles-editor/playwright-report/
            noodles-editor/test-results/
          retention-days: 7

  test-website:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: |
          cd website
          npm run build
