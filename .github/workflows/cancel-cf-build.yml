name: Cancel CloudFlare Pages Build

on:
  push:
    branches:
      - '**'

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel in-progress CF Pages deployments for this branch
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          BRANCH: ${{ github.ref_name }}
        run: |
          response=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments" \
            -H "Authorization: Bearer $CF_API_TOKEN")

          echo "$response" | jq -r \
            --arg branch "$BRANCH" \
            '.result[] | select(
              .deployment_trigger.metadata.branch == $branch and
              (.latest_stage.status == "active" or .latest_stage.status == "queued")
            ) | .id' \
          | while read -r id; do
              echo "Cancelling deployment $id for branch $BRANCH"
              curl -s -X POST \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments/$id/cancel" \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json"
            done
