name: Cancel CloudFlare Pages Build

on:
  push:
    branches:
      - '**'

permissions: {}

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel in-progress CF Pages deployments for this branch
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_PROJECT" ]; then
            echo "CF secrets not configured — skipping cancellation"
            exit 0
          fi
          page=1
          while true; do
            response=$(curl -sS \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments?per_page=25&page=$page" \
              -H "Authorization: Bearer $CF_API_TOKEN") || true

            # Check if API call succeeded
            if ! echo "$response" | jq -e '.success == true' > /dev/null 2>&1; then
              echo "Warning: Cloudflare API error on page $page"
              echo "$response" | jq -r '.errors[]?.message // "Unknown error"' 2>/dev/null || echo "Could not parse error response"
              break
            fi

            echo "$response" | jq -r \
              --arg branch "$BRANCH" \
              --arg sha "$COMMIT_SHA" \
              '.result[] | select(
                .deployment_trigger.metadata.branch == $branch and
                (.deployment_trigger.metadata.commit_hash | type) != "null" and
                .deployment_trigger.metadata.commit_hash != $sha and
                (.latest_stage.status == "active" or .latest_stage.status == "queued")
              ) | .id' \
            | while read -r id; do
                echo "Cancelling deployment $id for branch $BRANCH"
                cancel_response=$(curl -sS -X POST \
                  "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments/$id/cancel" \
                  -H "Authorization: Bearer $CF_API_TOKEN" \
                  -H "Content-Type: application/json") || true

                if ! echo "$cancel_response" | jq -e '.success == true' > /dev/null 2>&1; then
                  echo "Warning: Failed to cancel deployment $id"
                  echo "$cancel_response" | jq -r '.errors[]?.message // "Unknown error"' 2>/dev/null || true
                else
                  echo "Successfully cancelled deployment $id"
                fi
              done

            total=$(echo "$response" | jq '.result_info.total_count')
            per_page=$(echo "$response" | jq '.result_info.per_page')
            if [ $((page * per_page)) -ge "$total" ]; then
              break
            fi
            page=$((page + 1))
          done
