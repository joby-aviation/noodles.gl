name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: |
            website/yarn.lock
            noodles-editor/yarn.lock

      - name: Enable Corepack
        run: corepack enable yarn

      - name: Install dependencies for website
        run: yarn install
        working-directory: ./website

      - name: Install dependencies for app
        run: yarn install
        working-directory: ./noodles-editor

      - name: Generate AI context bundles
        run: yarn generate:context
        working-directory: ./noodles-editor

      - name: Build all for GitHub Pages
        run: yarn build:all

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Ensure Custom 404 Overwrites Default
        run: cp website/static/404.html website/build/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload website build: website at root, app at /app
          path: './website/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
