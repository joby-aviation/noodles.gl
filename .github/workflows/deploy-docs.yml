name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # Sourcemaps are built and uploaded to PostHog error tracking only when both are set.
      # Without them the deploy builds no sourcemaps, as before. Job-level `if:` cannot
      # read secrets, so the steps check this flag instead.
      POSTHOG_SOURCEMAPS_CONFIGURED: ${{ secrets.POSTHOG_CLI_API_KEY != '' && vars.POSTHOG_CLI_PROJECT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all for GitHub Pages
        run: npm run build:all
        env:
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          SOURCEMAPS: ${{ env.POSTHOG_SOURCEMAPS_CONFIGURED }}
          # The app build runs out of heap at Node's ~4 GB default once it also writes maps
          NODE_OPTIONS: ${{ env.POSTHOG_SOURCEMAPS_CONFIGURED == 'true' && '--max-old-space-size=8192' || '' }}

      # Injects PostHog chunk ids into the built JS (these injected files are what ship),
      # uploads the maps, then deletes them and strips their sourceMappingURL comments
      - name: Upload sourcemaps to PostHog
        if: env.POSTHOG_SOURCEMAPS_CONFIGURED == 'true'
        run: |
          npx --yes @posthog/cli@0.18.12 sourcemap process \
            --directory website/build/app \
            --release-name noodles-gl \
            --release-version "$GITHUB_SHA" \
            --delete-after
          # Never publish a map, even one the CLI skipped
          find website/build/app -name '*.map' -type f -print -delete
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST || 'https://us.posthog.com' }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Ensure Custom 404 Overwrites Default
        run: cp website/static/404.html website/build/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload website build: website at root, app at /app
          path: './website/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
