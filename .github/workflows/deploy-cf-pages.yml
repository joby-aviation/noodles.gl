name: Deploy to Cloudflare Pages

# Builds on GitHub runners and uploads with Wrangler, instead of Cloudflare's
# Git integration, which runs one build at a time on the Free plan.
# Automatic deployments must stay disabled in the Cloudflare dashboard
# (Settings > Builds > Branch control) or every push builds twice.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push to a PR replaces its in-progress preview build. Builds for main finish.
concurrency:
  group: cf-pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    # Fork PRs don't get secrets
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Sets a "Pages preview" commit status and, on PRs, keeps one comment with the
      # preview links up to date. Written from the workflow instead of a file in the
      # repo because PR branches that predate it don't have the file.
      - name: Report build started
        run: |
          cat > "$RUNNER_TEMP/report.sh" <<'EOF'
          set -euo pipefail
          state=$1
          marker='<!-- cf-pages-preview -->'
          case $state in
            pending) status='⏳ Building'; description='Building preview'; target=$RUN_URL ;;
            success) status='✅ Deploy successful!'; description='Preview deployed'; target=$URL ;;
            *) state=failure; status='❌ Build failed'; description='Build or deploy failed'; target=$RUN_URL ;;
          esac

          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context='Pages preview' \
            -f description="$description" -f target_url="$target" > /dev/null

          if [ -z "$PR" ]; then exit 0; fi
          body="$marker
          ### Cloudflare Pages preview

          | | |
          | --- | --- |
          | **Latest commit** | \`${SHA:0:7}\` |
          | **Status** | $status |"
          if [ "$state" = success ]; then
            body+="
          | **Preview URL** | $URL |"
            if [ -n "$ALIAS" ]; then
              body+="
          | **Branch Preview URL** | $ALIAS |"
            fi
          fi
          body+="

          [View logs]($RUN_URL)"

          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          EOF
          bash "$RUNNER_TEMP/report.sh" pending

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Build the branch head, not the PR merge commit, so the preview matches the branch
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only main saves the cache, so PR pushes don't evict other workflows' caches
      - name: Restore Docusaurus cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            website/.docusaurus
            website/node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            docusaurus-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            docusaurus-${{ runner.os }}-

      # Same output as `npm run build:all:cloudflare`, with the two builds in parallel
      - name: Build website and app
        env:
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          npm run build:website &
          website=$!
          npm run build:app:cloudflare &
          app=$!
          wait $website
          wait $app
          mkdir -p website/build/app
          cp -r noodles-editor/dist/* website/build/app/

      - name: Save Docusaurus cache
        if: github.event_name == 'push'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            website/.docusaurus
            website/node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/build --project-name=noodles-gl --branch=${{ github.head_ref || github.ref_name }}
          # Creates a GitHub deployment, which links the preview URL on the PR
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Skipped when a newer push cancels this run, so it can't overwrite the newer run's status
      - name: Report result
        if: ${{ !cancelled() }}
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          JOB_STATUS: ${{ job.status }}
        run: bash "$RUNNER_TEMP/report.sh" "$JOB_STATUS"
